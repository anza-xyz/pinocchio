[package]
name = "pinocchio-system"
description = "Pinocchio helpers to invoke System program instructions"
version = "0.7.0"
edition = { workspace = true }
license = { workspace = true }
readme = "./README.md"
repository = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["rlib"]

# Keeping these features as no-op. They can be removed in the next
# major release.
[features]
account-resize = []
unsafe-account-resize = []

[dependencies]
pinocchio = { workspace = true, features = ["cpi"] }
solana-address = { workspace = true, features = ["decode"] }
